<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gulegul Flowers — 3D Rose Hero</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fdf2f8; --fg:#831843; --primary:#db2777; --gold:#a16207; --muted:#475569; --border:#fbcfe8;
  --serif:"Cormorant Garamond","Cormorant",Georgia,"Times New Roman",serif;
  --sans:"Montserrat",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --gutter:clamp(16px,5vw,64px);
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--sans);overflow-x:hidden}
.nav{position:absolute;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;justify-content:space-between;padding:20px var(--gutter)}
.brand{font:600 clamp(22px,3vw,28px)/1 var(--serif);letter-spacing:.04em;color:var(--fg);text-decoration:none}
.nav a.link{font:500 13px/1 var(--sans);letter-spacing:.14em;text-transform:uppercase;color:var(--fg);text-decoration:none;padding:14px 4px}
.nav .links{display:none;gap:28px}
@media(min-width:820px){.nav .links{display:flex}}

.hero{position:relative;isolation:isolate;min-height:min(100svh,860px);display:grid;align-items:center;
  padding:96px var(--gutter) 64px;overflow:hidden;
  background:radial-gradient(120% 90% at 78% 40%,#fff 0%,#fde4ef 45%,#fdf2f8 80%)}
.hero-grid{display:grid;gap:8px;width:100%;max-width:1280px;margin:0 auto;grid-template-columns:minmax(0,1fr)}
@media(min-width:960px){.hero-grid{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:center}}
.copy{position:relative;z-index:2;min-width:0}
.eyebrow{margin:0 0 18px;font:500 12px/1 var(--sans);letter-spacing:.3em;text-transform:uppercase;color:var(--gold)}
h1{margin:0;font:500 clamp(2.6rem,7vw,5.4rem)/1.02 var(--serif);letter-spacing:-.01em;color:var(--fg);text-wrap:balance}
h1 em{font-style:italic;color:var(--primary)}
.lede{margin:22px 0 0;max-width:46ch;font:400 clamp(15px,1.5vw,17px)/1.7 var(--sans);color:var(--muted)}
.cta{display:flex;flex-wrap:wrap;gap:12px;margin-top:32px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;min-height:48px;padding:0 28px;border-radius:999px;
  font:600 13px/1 var(--sans);letter-spacing:.12em;text-transform:uppercase;text-decoration:none;cursor:pointer;
  transition:transform .25s ease,box-shadow .25s ease,background .25s ease}
.btn:focus-visible{outline:3px solid var(--primary);outline-offset:3px}
.btn-primary{background:var(--primary);color:#fff;box-shadow:0 10px 24px -10px rgba(219,39,119,.6)}
.btn-primary:hover{transform:translateY(-2px);box-shadow:0 14px 28px -10px rgba(219,39,119,.7)}
.btn-wa{background:#fff;color:var(--fg);border:1px solid var(--border)}
.btn-wa:hover{background:#fff7fb;transform:translateY(-2px)}
.btn svg{width:18px;height:18px;flex:none}

/* The rose is sized by its container, never the viewport — this is what stops the clipped hero. */
.hero-art{position:relative;border-radius:28px;background:radial-gradient(75% 65% at 50% 38%,#4a0c1a 0%,#230610 55%,#12030a 100%);box-shadow:0 30px 70px -30px rgba(131,24,67,.55),inset 0 1px 0 rgba(255,255,255,.12);width:100%;aspect-ratio:1/1;max-height:70svh;min-height:300px;justify-self:center;overflow:hidden;contain:layout paint}
@media(min-width:960px){.hero-art{aspect-ratio:auto;height:min(78svh,720px);max-height:none}}
.hero-art .rose-canvas,.hero-art .rose-poster{position:absolute;inset:0;width:100%;height:100%;display:block}
.hero-art .rose-poster{object-fit:contain;opacity:1;transition:opacity .6s ease}
.hero-art.is-live .rose-poster{opacity:0}
.hero-art .rose-video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.hero-art.is-video .rose-poster{opacity:0}
.hero-art .rose-open{display:none}
.hero-art.is-fallback .rose-open{display:block}
.hero-art.is-fallback .rose-bud{display:none}
.hero-art.is-fallback .rose-canvas{display:none}
.hero-art .rose-canvas,.hero-art .rose-poster{-webkit-mask-image:linear-gradient(#000 82%,transparent);mask-image:linear-gradient(#000 82%,transparent)}
@media(prefers-reduced-motion:reduce){.hero-art .rose-poster{transition:none}.btn{transition:none}}

/* Glassmorphism: used only where something sits over the rose / photo, never behind body text. */
.glass{background:rgba(255,255,255,.42);border:1px solid rgba(255,255,255,.75);
  box-shadow:0 8px 32px -8px rgba(131,24,67,.25),inset 0 1px 0 rgba(255,255,255,.9);
  -webkit-backdrop-filter:blur(16px) saturate(170%);backdrop-filter:blur(16px) saturate(170%)}
@supports not ((backdrop-filter:blur(1px)) or (-webkit-backdrop-filter:blur(1px))){.glass{background:rgba(255,255,255,.92)}}
.nav{left:var(--gutter);right:var(--gutter);top:14px;padding:10px 20px;border-radius:999px}
.nav .brand{font-size:clamp(20px,2.6vw,26px)}
.btn-wa.glass{color:var(--fg)}
.btn-wa.glass:hover{background:rgba(255,255,255,.65)}
.chip{position:absolute;z-index:3;display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:18px;max-width:78%;
  font:500 12px/1.35 var(--sans);color:var(--fg)}
.chip b{display:block;font:600 17px/1.1 var(--serif);letter-spacing:.01em}
.chip i{flex:none;width:8px;height:8px;border-radius:50%;background:var(--primary);box-shadow:0 0 0 4px rgba(219,39,119,.18)}
.chip-a{left:4%;top:12%}
.chip-b{right:4%;bottom:14%}
@media(min-width:960px){.chip{padding:14px 20px;font-size:13px}.chip b{font-size:20px}.chip-a{left:2%;top:18%}.chip-b{right:2%;bottom:20%}}
body.poster-mode .nav,body.poster-mode .chip,body.poster-mode .copy,body.poster-mode .hero-art .rose-poster{display:none!important}
body.poster-mode{background:#12030a}
body.poster-mode .hero-art{background:none;box-shadow:none;border-radius:0}
body.poster-mode .hero{background:none;padding:0;min-height:0;display:block}
body.poster-mode .hero-grid{display:block;max-width:none}
</style>
</head>
<body>
<header class="nav glass">
  <a class="brand" href="#">Gulegul</a>
  <nav class="links" aria-label="Main"><a class="link" href="#">Wedding Decor</a><a class="link" href="#">Bouquets</a><a class="link" href="#">Gallery</a><a class="link" href="#">Contact</a></nav>
</header>
<main>
  <section class="hero" aria-labelledby="h">
    <div class="hero-grid">
      <div class="copy">
        <p class="eyebrow">Wedding &amp; Event Florals</p>
        <h1 id="h">Where every petal tells your <em>love story</em></h1>
        <p class="lede">Handcrafted stage decor, floral arches and bridal bouquets — designed around your day and delivered with care.</p>
        <div class="cta">
          <a class="btn btn-primary" href="#">Explore Decor</a>
          <a class="btn btn-wa glass" href="https://wa.me/" rel="noopener">
            <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm5.2 14.2c-.2.6-1.3 1.2-1.8 1.2-.5.1-1 .2-3.3-.7-2.8-1.1-4.5-3.9-4.7-4.1-.1-.2-1.100-1.500-1.100-2.800 0-1.300.7-2 .9-2.200.2-.3.5-.3.7-.3h.5c.2 0 .4 0 .6.5l.8 1.900c.1.200.1.400 0 .5l-.3.500-.4.400c-.1.200-.3.300-.1.600.2.300.8 1.300 1.700 2.100 1.100 1 2.100 1.300 2.400 1.400.3.100.5.100.6-.1l.9-1.100c.2-.2.400-.2.600-.1l1.800.9c.3.100.5.200.5.300.1.200.1.800-.1 1.400Z"/></svg>
            WhatsApp
          </a>
        </div>
      </div>
      <div class="hero-art" data-rose data-video="rose-bloom.mp4" role="img" aria-label="A slowly turning red rose">
        <img class="rose-poster rose-bud" src="rose-bud.png" alt="" width="1000" height="1000" decoding="async">
        <img class="rose-poster rose-open" src="rose-poster.png" alt="" width="1000" height="1000" decoding="async" loading="lazy">
      </div>
    </div>
  </section>
</main>
<script>if(/[?&]poster\b/.test(location.search))document.body.classList.add('poster-mode')</script>
<script src="rose.js" defer></script>
</body>
</html>
